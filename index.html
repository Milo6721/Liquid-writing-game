<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasstype</title>
<meta name="description" content="A gamified speed typing experience in liquid glass.">
<style>
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
  --text:#f5f5f7; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
  --bg:#05050b;
  --glass-a:rgba(255,255,255,.16); --glass-b:rgba(255,255,255,.04);
  --glass-edge:rgba(255,255,255,.28); --glass-hi:rgba(255,255,255,.55);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --pink:#ff375f; --purple:#bf5af2; --teal:#64d2ff; --gold:#ffd60a;
  --orb-op:.85;
  --lh:3.1rem;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --text:#1d1d1f; --text2:rgba(60,60,67,.7); --text3:rgba(60,60,67,.35);
  --bg:#e9ecf6;
  --glass-a:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.22);
  --glass-edge:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,1);
  --shadow:0 18px 50px rgba(60,70,120,.18);
  --orb-op:.6;
  color-scheme: light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --text:#1d1d1f; --text2:rgba(60,60,67,.7); --text3:rgba(60,60,67,.35);
    --bg:#e9ecf6;
    --glass-a:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.22);
    --glass-edge:rgba(255,255,255,.9); --glass-hi:rgba(255,255,255,1);
    --shadow:0 18px 50px rgba(60,70,120,.18);
    --orb-op:.6; color-scheme: light;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ---------- Backdrop ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb-op);will-change:transform;animation:float 22s ease-in-out infinite alternate}
.o1{width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,#5e5ce6,transparent 68%)}
.o2{width:46vmax;height:46vmax;right:-12vmax;top:4vmax;background:radial-gradient(circle,#ff375f,transparent 66%);animation-duration:28s;animation-delay:-6s}
.o3{width:50vmax;height:50vmax;left:18vmax;bottom:-24vmax;background:radial-gradient(circle,#0a84ff,transparent 66%);animation-duration:25s;animation-delay:-12s}
.o4{width:34vmax;height:34vmax;right:6vmax;bottom:-10vmax;background:radial-gradient(circle,#ff9f0a,transparent 66%);animation-duration:31s;animation-delay:-3s;opacity:calc(var(--orb-op)*.7)}
.o5{width:28vmax;height:28vmax;left:-6vmax;bottom:8vmax;background:radial-gradient(circle,#30d1b8,transparent 66%);animation-duration:34s;animation-delay:-9s;opacity:calc(var(--orb-op)*.6)}
@keyframes float{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vmax,4vmax,0) scale(1.12)}100%{transform:translate3d(-4vmax,8vmax,0) scale(.94)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- Liquid glass ---------- */
.glass{
  position:relative;isolation:isolate;
  background:linear-gradient(135deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
  backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
  border:1px solid var(--glass-edge);
  border-radius:28px;
  box-shadow:
    inset 0 1.5px 0 var(--glass-hi),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 1.5px 0 1px -1px rgba(255,255,255,.35),
    inset -1.5px 0 1px -1px rgba(255,255,255,.18),
    inset 0 0 28px rgba(255,255,255,.06),
    var(--shadow);
}
.glass::before{ /* specular sheen that follows the pointer */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(420px circle at var(--mx,20%) var(--my,0%),rgba(255,255,255,.22),transparent 55%);
  opacity:var(--sheen,.55);transition:opacity .3s;
}
.glass:hover{--sheen:1}
.glass::after{ /* top-left rim light */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;padding:1px;
  background:linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.8;
}
.pill{border-radius:999px}

/* ---------- Layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
.nav{position:sticky;top:14px;z-index:20;margin:14px auto 0;max-width:1080px;width:calc(100% - 28px);display:flex;align-items:center;gap:14px;padding:8px 10px 8px 18px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.03em;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,#64d2ff,#5e5ce6 55%,#bf5af2);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(94,92,230,.5)}
.logo svg{width:16px;height:16px}
.tabs{position:relative;display:flex;margin:0 auto;padding:4px;border-radius:999px;background:rgba(120,120,140,.14);box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.tab{position:relative;z-index:1;white-space:nowrap;padding:8px 18px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--text2);transition:color .25s}
.tab.on{color:var(--text)}
.ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 10px rgba(0,0,0,.18);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
.navr{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;background:rgba(120,120,140,.14);font-size:.82rem;font-weight:600;white-space:nowrap}
.chip .lv{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--orange),var(--pink));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(120,120,140,.14);transition:transform .2s,background .2s}
.icon-btn:hover{background:rgba(120,120,140,.28)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.off{opacity:.45}

.view{display:none;animation:in .55s cubic-bezier(.2,.8,.2,1) both}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1.big{font-size:clamp(2.2rem,5.4vw,3.6rem);font-weight:800;letter-spacing:-.045em;line-height:1.04}
.grad{background:linear-gradient(100deg,#64d2ff,#bf5af2 50%,#ff375f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text2);font-size:1.05rem;margin-top:10px;max-width:46ch;line-height:1.45}
h2.sec{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;margin:44px 4px 16px}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:38px;align-items:stretch}
.hero-l{padding:8px 4px}
.rank{padding:22px;display:flex;gap:20px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:rgba(120,120,140,.22)}
.ring .val{stroke:url(#rg);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(191,90,242,.6))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:800;letter-spacing:-.04em}
.rank h3{font-size:1.3rem;letter-spacing:-.03em}
.rank p{color:var(--text2);font-size:.88rem;margin-top:3px}
.mini{display:flex;gap:18px;margin-top:14px}
.mini div{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mini b{display:block;font-size:1.25rem;color:var(--text);letter-spacing:-.03em;text-transform:none;margin-top:1px}

/* level grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lvl{padding:20px;border-radius:26px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:178px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.lvl:not(.lock):hover{transform:translateY(-5px) scale(1.015)}
.lvl:not(.lock):active{transform:scale(.97)}
.lvl .top{display:flex;justify-content:space-between;align-items:flex-start}
.num{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.04em;
  background:linear-gradient(145deg,hsl(var(--h) 90% 62%),hsl(calc(var(--h) + 40) 85% 52%));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.15),0 6px 18px hsl(var(--h) 90% 55% / .45)}
.lvl h4{font-size:1.1rem;font-weight:700;letter-spacing:-.025em}
.lvl p{font-size:.84rem;color:var(--text2);line-height:1.38;margin-top:2px}
.lvl .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text2);font-weight:600}
.stars{display:flex;gap:3px}
.stars svg{width:18px;height:18px;fill:rgba(120,120,140,.28)}
.stars svg.f{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(255,214,10,.6))}
.lvl.lock{opacity:.55;cursor:not-allowed;filter:saturate(.5)}
.lvl.lock .num{background:rgba(120,120,140,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.lvl.lock .num svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(120,120,140,.2);color:var(--text2);letter-spacing:.02em}
.badge.new{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 0 14px rgba(10,132,255,.55)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:650;font-size:.98rem;letter-spacing:-.015em;transition:transform .25s cubic-bezier(.3,1.5,.5,1),filter .2s}
.btn:hover{transform:scale(1.04)}
.btn:active{transform:scale(.95)}
.btn.pri{color:#fff;background:linear-gradient(180deg,#3d9bff,#0a6cf0);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 3px rgba(0,0,0,.18),0 8px 24px rgba(10,132,255,.5)}
.btn.sec{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.14);border:1px solid rgba(255,255,255,.18)}

/* ---------- Play ---------- */
.playbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;padding:9px 16px 9px 11px;font-weight:600;font-size:.9rem}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ptitle{display:flex;align-items:center;gap:10px;font-weight:650}
.ptitle .num{width:34px;height:34px;border-radius:11px;font-size:.95rem}
.ptitle small{display:block;color:var(--text2);font-weight:500;font-size:.78rem;margin-top:1px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px 20px;border-radius:24px}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);font-weight:700}
.stat b{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.stat b i{font-style:normal;font-size:.95rem;color:var(--text2);font-weight:600;margin-left:3px;letter-spacing:0}
.prog{height:6px;border-radius:9px;background:rgba(120,120,140,.22);margin-top:10px;overflow:hidden}
.prog u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--blue),var(--purple));transition:width .15s linear;box-shadow:0 0 10px rgba(10,132,255,.7)}
.pace{position:relative}
.stage{margin-top:16px;padding:34px 38px;border-radius:34px;position:relative;cursor:text}
.viewport{height:calc(var(--lh)*3);overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(#000 0,#000 70%,transparent);mask-image:linear-gradient(#000 0,#000 70%,transparent)}
.inner{position:relative;font-family:var(--mono);font-size:1.62rem;line-height:var(--lh);white-space:pre-wrap;word-break:keep-all;transition:transform .22s cubic-bezier(.3,1,.4,1)}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;height:var(--lh);color:var(--text3);transition:color .08s}
.c.ok{color:var(--text)}
.c.bad{color:var(--red);background:rgba(255,69,58,.16);border-radius:6px;text-shadow:0 0 14px rgba(255,69,58,.5)}
.c.sp{width:1ch}
.caret{position:absolute;left:0;top:0;width:3px;height:calc(var(--lh) - .9rem);margin-top:.45rem;border-radius:3px;background:linear-gradient(var(--teal),var(--blue));box-shadow:0 0 14px var(--blue),0 0 4px var(--teal);transition:transform .11s cubic-bezier(.3,1,.4,1);pointer-events:none;animation:blink 1.1s steps(2) infinite}
.stage.run .caret{animation:none}
@keyframes blink{50%{opacity:.15}}
.hint{position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;pointer-events:none;transition:opacity .4s}
.hint span{padding:10px 20px;border-radius:99px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:.9rem;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.2);animation:pulse 2.2s ease-in-out infinite}
.stage.run .hint,.stage.started .hint{opacity:0}
@keyframes pulse{50%{transform:scale(1.04);opacity:.8}}
.stage.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.keys{margin:18px auto 0;max-width:760px;padding:14px;border-radius:26px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:opacity .3s,max-height .4s,padding .4s,margin .4s;max-height:300px;overflow:hidden}
.keys.hide{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:0;border-width:0}
.krow{display:flex;gap:6px;width:100%}
.k{flex:1 1 0;height:44px;border-radius:11px;display:grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--text2);text-transform:uppercase;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 4px rgba(0,0,0,.15);transition:transform .08s,background .15s,box-shadow .15s,color .15s}
.k.w15{flex:1.5}.k.w18{flex:1.8}.k.w22{flex:2.2}.k.w6{flex:6}
.k.next{color:#fff;background:linear-gradient(180deg,#64b5ff,#0a84ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 22px rgba(10,132,255,.9),0 0 4px rgba(10,132,255,.9);transform:translateY(-1px)}
.k.press{transform:translateY(2px) scale(.94);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.25))}
.k.press.next{background:linear-gradient(180deg,#64b5ff,#0a84ff)}
.k.err{background:linear-gradient(180deg,#ff6b61,#ff453a);color:#fff;box-shadow:0 0 18px rgba(255,69,58,.8)}
.tips{display:flex;justify-content:center;gap:18px;margin-top:18px;color:var(--text2);font-size:.82rem;flex-wrap:wrap}
kbd{font-family:var(--font);font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(120,120,140,.22);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);margin-right:4px}

/* free play */
.free{margin-top:38px;padding:44px 34px;text-align:center}
.free h2{font-size:2rem;font-weight:800;letter-spacing:-.04em}
.free p{color:var(--text2);margin:8px auto 26px;max-width:44ch}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(120,120,140,.16);box-shadow:inset 0 1px 3px rgba(0,0,0,.18);gap:2px;margin-bottom:26px}
.seg button{padding:9px 22px;border-radius:99px;font-weight:650;color:var(--text2);transition:all .25s}
.seg button.on{color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 8px rgba(0,0,0,.18)}
.pb{display:flex;justify-content:center;gap:34px;margin-top:30px;flex-wrap:wrap}
.pb div{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);font-weight:700}
.pb b{display:block;font-size:1.7rem;color:var(--text);letter-spacing:-.04em;text-transform:none;margin-top:2px}

/* awards */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.a{padding:18px;display:flex;gap:16px;align-items:center;border-radius:24px}
.a .ic{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(145deg,hsl(var(--h) 90% 62%),hsl(calc(var(--h) + 35) 85% 50%));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 6px 16px hsl(var(--h) 90% 55%/.4)}
.a.no{opacity:.5}.a.no .ic{filter:grayscale(1);background:rgba(120,120,140,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.a b{display:block;font-size:1rem;letter-spacing:-.02em}
.a span{font-size:.82rem;color:var(--text2);line-height:1.35;display:block;margin-top:2px}

/* stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:30px}
.sgrid .stat b{font-size:2.4rem}
.chart{margin-top:16px;padding:24px 26px}
.chart h4{font-size:1rem;margin-bottom:12px;letter-spacing:-.02em}
.chart svg{width:100%;height:auto;overflow:visible}
.empty{color:var(--text2);text-align:center;padding:34px 0}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scrim.on{display:grid;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);padding:34px 32px 30px;text-align:center;border-radius:38px;animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;max-height:94vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
.modal h2{font-size:1.9rem;font-weight:800;letter-spacing:-.045em}
.modal .sm{color:var(--text2);margin-top:4px;font-size:.95rem}
.big-wpm{font-size:5.4rem;font-weight:800;letter-spacing:-.07em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.big-wpm small{font-size:1.1rem;color:var(--text2);letter-spacing:0;font-weight:600;margin-left:6px}
.rstars{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.rstars svg{width:46px;height:46px;fill:rgba(120,120,140,.3);transform:scale(.4);opacity:0}
.rstars svg.f{fill:var(--gold);filter:drop-shadow(0 0 12px rgba(255,214,10,.8));animation:starin .7s cubic-bezier(.2,1.8,.4,1) forwards;animation-delay:var(--d)}
.rstars svg:not(.f){transform:scale(1);opacity:1}
@keyframes starin{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

const FOLD = {ą:"a",ć:"c",ę:"e",ł:"l",ń:"n",ó:"o",ś:"s",ź:"z",ż:"z",Ą:"A",Ć:"C",Ę:"E",Ł:"L",Ń:"N",Ó:"O",Ś:"S",Ź:"Z",Ż:"Z"};

const fold = s => s.replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => FOLD[c]);
const finalize = s => (LANG === "pl" && !S.set.diac) ? fold(s) : s;
const mergePools = (...ps) => ps.flatMap(p => p[LANG]);

function genLevel(i) { const L = LEVELS[i]; return finalize(shuffle(L.pool[LANG]).slice(0, L.k).join(" ")); }
function genFree(d) {
  const need = d * 17; let out = [];
  while (out.join(" ").length < need) out = out.concat(shuffle(mergePools(LV4, LV5, LV6, LV8)));
  return finalize(out.join(" "));
}

let AC;
function tone(f,d=.05,type="triangle",v=.05,when=0){
  if(!S.set.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), tt=AC.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(f,tt);
    g.gain.setValueAtTime(v,tt); g.gain.exponentialRampToValueAtTime(.0001,tt+d);
    o.connect(g).connect(AC.destination); o.start(tt); o.stop(tt+d);
  }catch(e){}
}

function spark(vals,w=600,h=150,fill=true){
  if(vals.length<2) return `<div class="empty">${t("noData")}</div>`;
  const max=Math.max(...vals,10)*1.1, min=Math.max(0,Math.min(...vals)*.8);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-((v-min)/(max-min||1))*h]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2; d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const id="g"+rnd(1e6);
  return `<svg viewBox="-6 -10 ${w+12} ${h+20}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64d2ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
  <linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf5af2" stop-opacity=".35"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></linearGradient></defs>
  ${fill?`<path d="${d} L${w},${h} L0,${h}Z" fill="url(#${id}f)"/>`:""}
  <path d="${d}" fill="none" stroke="url(#${id})" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

}

  const L=LEVELS[i];
  $("#ptitle").innerHTML=`<div class="num" style="--h:${L.h}">${i+1}</div><div>${L2(L.n)}<small>★ ${L.t[0]} · ★★ ${L.t[1]} · ★★★ ${L.t[2]} wpm</small></div>`;
  go("play"); setupGame({mode:"level",level:i,text:genLevel(i)});
}
const durLbl = d => d>=120 ? "2m" : d+"s";
function startFree(d){
  $("#ptitle").innerHTML=`<div class="num" style="--h:200">${durLbl(d)}</div><div>${t("freeTitle")}<small>${LANG==="pl"?"Wyścig z czasem":"Beat the clock"}</small></div>`;
  go("play"); setupGame({mode:"free",dur:d,text:genFree(d)});
}
function restart(){ if(!game) return; game.mode==="level"?startLevel(game.level):startFree(game.dur); }
function stopGame(){ clearInterval(timer); timer=null; game=null; }
$("#bBack").onclick=()=>{ const m=game?.mode; stopGame(); go(m==="free"?"free":"levels"); };
$("#bRestart").onclick=restart;

function elapsed(){ return game.start ? (performance.now()-game.start)/1000 : 0; }
function liveWpm(){ const tt=elapsed(); return tt>.5 ? Math.round(game.cur/5/(tt/60)) : 0; }
function liveAcc(){ return game.keys ? Math.round(game.okKeys/game.keys*100) : 100; }
function updateHud(){
  const tt=elapsed();
  $("#hWpm").innerHTML=liveWpm()+"<i>wpm</i>";
  $("#hAcc").innerHTML=liveAcc()+"<i>%</i>";
  const v = game.mode==="free" ? Math.max(0,game.dur-tt) : tt;
  $("#hTime").innerHTML=(game.mode==="free"?Math.ceil(v):v.toFixed(1))+"<i>s</i>";
  const pr = game.mode==="free" ? Math.min(100,tt/game.dur*100) : game.pos/game.text.length*100;
  $("#hProg").innerHTML=Math.round(pr)+"<i>%</i>"; $("#hBar").style.width=pr+"%";
}
function tick(){
  if(!game||game.done) return;
  const tt=elapsed();
  if(tt-game.lastSample>=1){ game.lastSample=Math.floor(tt); game.samples.push(liveWpm()); }
  updateHud();
  if(game.mode==="free" && tt>=game.dur) finish();
}
function moveCaret(){
  const el = chars[game.pos] || chars[chars.length-1];
  const atEnd = game.pos>=chars.length;
  const x = el.offsetLeft + (atEnd?el.offsetWidth:0), y = el.offsetTop;
  caret.style.transform=`translate(${x}px,${y}px)`;
  const lh=parseFloat(getComputedStyle(inner).lineHeight);
  const line=Math.round(y/lh);
  inner.style.transform=`translateY(${-Math.max(0,line-1)*lh}px)`;
}

addEventListener("keydown",e=>{
  if($("#scrim").classList.contains("on")){
    if(e.key==="Enter"){ e.preventDefault(); $("#scrim .pri")?.click(); }
    if(e.key==="Escape") $("#rExit")?.click();
    return;
  }
  if(view!=="play"||!game||game.done) return;
  if(e.key==="Escape"){ $("#bBack").click(); return; }
  if(e.key==="Tab"){ e.preventDefault(); restart(); return; }
  if(e.metaKey||(e.ctrlKey&&!e.altKey)) return;   /* Alt / AltGr stay allowed for ą ę ł … */
  if(e.key==="Backspace"){
    e.preventDefault();
    if(game.pos>0){
      game.pos--; if(game.typed[game.pos]===game.text[game.pos]) game.cur--;
      game.typed.length=game.pos;
      chars[game.pos].className="c"+(game.text[game.pos]===" "?" sp":"");
      flashKey(e); moveCaret(); highlightNext(); updateHud();
    }
    return;
  }
  if(e.key.length!==1) return;
  e.preventDefault();
  if(!game.start){ game.start=performance.now(); stage.classList.add("run","started"); timer=setInterval(tick,100); }
  const exp=game.text[game.pos], ok=e.key===exp;
  game.keys++; game.typed[game.pos]=e.key;
  chars[game.pos].classList.add(ok?"ok":"bad");
  if(ok){ game.okKeys++; game.cur++; sClick(); } else { sErr(); stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }
  flashKey(e,!ok);
  game.pos++; moveCaret(); highlightNext(); updateHud();
  if(game.pos>=game.text.length && game.mode==="level") finish();
});

/* ============ results ============ */
const dayStr=o=>{ const d=new Date(); d.setDate(d.getDate()+o); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
function finish(){
  if(game.done) return; game.done=true; clearInterval(timer);
  const tt=Math.max(.5,elapsed()), g=game;
  const wpm=Math.round(g.cur/5/(tt/60)), acc=g.keys?Math.round(g.okKeys/g.keys*1000)/10:100;
  const run={ wpm, acc:Math.round(acc), accExact:acc, chars:g.cur, keys:g.keys, secs:tt, mode:g.mode, samples:g.samples.concat([wpm]) };
  let stars=0, passed=true, L=null, newStars=0, firstClear=false;
  if(g.mode==="level"){
    L=LEVELS[g.level]; passed = acc>=L.acc;
    stars = !passed?0 : wpm>=L.t[2]?3 : wpm>=L.t[1]?2 : wpm>=L.t[0]?1 : 0;
    const prev=S.levels[g.level]||{stars:0,best:0};
    firstClear = prev.stars<1 && stars>=1;
    newStars=Math.max(0,stars-prev.stars);
    S.levels[g.level]={ stars:Math.max(prev.stars,stars), best:Math.max(prev.best||0,wpm) };
  } else { const d=g.dur; if(wpm>(S.free[d]||0)) S.free[d]=wpm; }
  const xpGain = Math.round(g.cur*Math.pow(acc/100,2)*(1+stars*.25)) + newStars*20 + (firstClear?15:0);
  const before=rankOf(S.xp); S.xp+=xpGain; const after=rankOf(S.xp);
  S.totals.runs++; S.totals.keys+=g.keys; S.totals.chars+=g.cur; S.totals.secs+=tt;
  S.history.push({wpm,acc:Math.round(acc),t:Date.now(),mode:g.mode}); if(S.history.length>200) S.history.shift();
  const today=dayStr(0), yest=dayStr(-1);
  if(S.streak.last!==today){ S.streak.count = S.streak.last===yest ? S.streak.count+1 : 1; S.streak.last=today; }
  const got=[]; AWARDS.forEach(a=>{ if(!S.ach[a.id] && a.f(S,run)){ S.ach[a.id]=Date.now(); got.push(a); } });
  persist(); renderChrome();
  showResult({run,stars,passed,L,xpGain,before,after,got,firstClear,g});
}
function showResult(r){
  const {run,stars,passed,L,xpGain,before,after,got,firstClear,g}=r;
  const isLevel=g.mode==="level", lastLevel=isLevel && g.level>=LEVELS.length-1;
  let title, sub="";
  if(isLevel){
    if(!passed){ title=t("almost"); sub=t("almostSub",L.acc,run.accExact); }
    else if(stars===0){ title=t("slow"); sub=t("slowSub",L.t[0]); }
    else if(stars===3){ title=t("perfect"); sub=t("perfectSub"); }
    else { title=stars===2?t("great"):t("cleared"); sub=t("nextStar",L.t[stars]); }
  } else { title=t("timeUp"); sub=t("sprintSub",durLbl(g.dur)); }
  const canNext = isLevel && stars>=1 && !lastLevel;
  const lv = after.lv>before.lv;
  $("#modal").innerHTML=`
    <h2>${title}</h2><p class="sm">${sub}</p>
    <div class="big-wpm grad">${run.wpm}<small>wpm</small></div>
    ${isLevel?`<div class="rstars">${[0,1,2].map(i=>`<svg class="${i<stars?"f":""}" style="--d:${.35+i*.28}s" viewBox="0 0 24 24"><use href="#star"/></svg>`).join("")}</div>`:""}
    <div class="rgrid"><div><span>${t("accuracy")}</span><b>${run.accExact}%</b></div><div><span>${t("time")}</span><b>${run.secs.toFixed(1)}s</b></div><div><span>${t("keys")}</span><b>${run.keys}</b></div></div>
    <div class="rchart">${spark(run.samples,500,60,true)}</div>
    <div class="xpl"><span>${t("rank")} <b>${before.lv}</b> · ${before.name}</span><span><b>+${xpGain} XP</b></span></div>
    <div class="xpbar"><u id="xpU" style="width:${before.pct*100}%"></u></div>
    ${lv?`<div class="lvup">${t("rankUp",after.name,after.lv)}</div>`:""}
    ${got.length?`<div class="lvup" style="background:linear-gradient(135deg,rgba(10,132,255,.25),rgba(191,90,242,.25));border-color:rgba(10,132,255,.4)">${got.map(a=>a.e+" "+L2(a.n)).join(" · ")}</div>`:""}
    <div class="mact">
      <button class="btn sec glass pill" id="rExit" style="border-radius:999px">${isLevel?t("lvls"):t("done")}</button>
      <button class="btn ${canNext?"sec glass pill":"pri"}" id="rRetry" style="${canNext?"border-radius:999px":""}">${t("retry")}</button>
      ${canNext?`<button class="btn pri" id="rNext">${t("next")}</button>`:""}
    </div>`;
  $("#scrim").classList.add("on");
  requestAnimationFrame(()=>{ const u=$("#xpU"); if(u) u.style.width=(lv?100:after.pct*100)+"%"; });
  $("#rExit").onclick=()=>{ closeModal(); go(isLevel?"levels":"free"); };
  $("#rRetry").onclick=()=>{ closeModal(); restart(); };
  if(canNext) $("#rNext").onclick=()=>{ closeModal(); startLevel(g.level+1); };
  if(stars>=1||!isLevel){ sWin(stars||1); if(stars===3||lv||got.length||firstClear) confetti(); }
  got.forEach((a,i)=>setTimeout(()=>toast(a),700+i*500));
}
function closeModal(){ $("#scrim").classList.remove("on"); }
function toast(a){
  const el=document.createElement("div"); el.className="toast glass";
  el.innerHTML=`<div class="ic">${a.e}</div><div><b>${t("unlocked")}</b><span>${L2(a.n)}</span></div>`;
  $("#toasts").appendChild(el); sWin(1);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),450); },3600);
}

/* ============ confetti ============ */
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf=0;
function sizeFx(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
addEventListener("resize",sizeFx); sizeFx();
function confetti(){
  const cols=["#ff375f","#ff9f0a","#ffd60a","#30d158","#64d2ff","#0a84ff","#bf5af2"];
  for(let i=0;i<150;i++){
    const a=Math.random()*Math.PI*2, v=6+Math.random()*12;
    parts.push({x:innerWidth/2,y:innerHeight*.42,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*7,h:4+Math.random()*5,c:pick(cols),life:1});
  }
  if(!raf) raf=requestAnimationFrame(loop);
}
function loop(){
  const d=devicePixelRatio; cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=.35; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.0075;
    cx.save(); cx.translate(p.x*d,p.y*d); cx.rotate(p.r); cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.fillRect(-p.w/2*d,-p.h/2*d,p.w*d,p.h*d); cx.restore(); });
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height),0);
}

/* ============ boot ============ */
applyTheme(); applyLang(); renderLevels();
document.fonts?.ready.then(moveInd); requestAnimationFrame(moveInd);
</script>
